# Build an explicitly pinned RC1 reissue candidate, leaving published RC1 intact.
# It never creates/moves tags, pushes commits, or publishes GitHub Releases.
name: LLVM SH RC1 candidate packages (DEB, RPM, Windows)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full new RC1 candidate source commit SHA (published tag stays unchanged)'
        required: true
        type: string
      candidate_tree:
        description: 'Full expected Git tree SHA for that candidate commit'
        required: true
        type: string
      platform:
        description: 'Platforms to build (all preserves the original default)'
        required: false
        type: choice
        options:
          - all
          - linux
          - windows
        default: all
      upload_artifacts:
        description: 'Upload downloadable CI artifacts (review redistribution rights first)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  LLVM_SH_CANDIDATE_COMMIT: ${{ inputs.candidate_sha }}
  LLVM_SH_CANDIDATE_TREE: ${{ inputs.candidate_tree }}
  LLVM_SH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: llvm-sh-rc1-packages
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require immutable full candidate identities before expensive builds
        shell: python
        run: |
          import os, re
          for key in ('LLVM_SH_CANDIDATE_COMMIT', 'LLVM_SH_CANDIDATE_TREE'):
              if not re.fullmatch('[0-9a-f]{40}', os.environ[key]):
                  raise SystemExit('Need a full 40-character SHA: ' + key)
          if os.environ['LLVM_SH_CANDIDATE_COMMIT'] in (
              '090c682597f7155373681807330fbb0ac343a33c',
              'c8f8d9181205796eaa58f38700906ee19a6444c8'):
              raise SystemExit('Select a new library candidate; published RC1 stays unchanged')
  ubuntu-deb:
    needs: validate-candidate
    if: ${{ inputs.platform != 'windows' }}
    name: Ubuntu 26.04 / DEB (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - name: Check out CI scripts only (workflow branch)
        uses: actions/checkout@v6
        with:
          path: automation
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Check out pinned RC1 candidate source (not published tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: source
          persist-credentials: false
      - name: Install build/packaging prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang lld cmake meson ninja-build python3 python3-psutil git binutils file dpkg-dev qemu-user \
            libedit-dev libxml2-dev zlib1g-dev libzstd-dev liblzma-dev
      - name: Build, package, install and smoke test
        shell: bash
        run: bash automation/.github/ci/build-llvm-sh-linux.sh deb
      - name: Upload package for review (explicit opt-in)
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: llvm-sh-rc1-candidate-ubuntu2604-deb-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  fedora-rpm:
    needs: validate-candidate
    if: ${{ inputs.platform != 'windows' }}
    name: Fedora 45 / RPM (x86_64)
    runs-on: ubuntu-26.04
    container: fedora:45
    timeout-minutes: 330
    steps:
      - name: Install build/packaging prerequisites in Fedora container
        shell: bash
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git clang lld cmake meson ninja-build python3 python3-psutil qemu-user-static gcc gcc-c++ binutils file \
            rpm-build rpmdevtools libedit-devel libxml2-devel \
            zlib-devel libzstd-devel xz-devel tar gzip zip unzip findutils which
      - name: Check out CI scripts only (workflow branch)
        uses: actions/checkout@v6
        with:
          path: automation
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Check out pinned RC1 candidate source (not published tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: source
          persist-credentials: false
      - name: Build, package, install and smoke test
        shell: bash
        run: bash automation/.github/ci/build-llvm-sh-linux.sh rpm
      - name: Upload package for review (explicit opt-in)
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: llvm-sh-rc1-candidate-fedora45-rpm-x86_64
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
            dist/smoke-rpm.txt
            dist/*-rpm.txt
            dist/timings.tsv
            dist/source-tests-rpm/**
            dist/install-layout-rpm/**
            dist/target-runtime-build/**
            dist/freestanding-staged-rpm/**
            dist/freestanding-rpm/**
            dist/libraries-staged-rpm/**
            dist/libraries-rpm/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload Fedora-built Linux portable ZIP for review (explicit opt-in)
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: llvm-sh-rc1-candidate-fedora45-linux-zip-x86_64
          path: |
            dist/llvm-sh-rc1-candidate-*-fedora45-linux-x86_64.zip
            dist/llvm-sh-rc1-candidate-*-fedora45-linux-x86_64.zip.sha256
            dist/smoke-linux-zip.txt
            dist/*-linux-zip.txt
            dist/freestanding-linux-zip/**
            dist/libraries-linux-zip/**
          if-no-files-found: error
          retention-days: 14

  windows-runtime-staging:
    needs: validate-candidate
    if: ${{ inputs.platform != 'linux' }}
    name: Windows bare-metal install layout
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out pinned runtime recipes
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: source
          sparse-checkout: runtimes/sh
          persist-credentials: false
      - name: Set up runtime-build Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check target prefix and native staging paths before building LLVM
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check meson==1.12.1 ninja==1.13.0
          if ($LASTEXITCODE -ne 0) { throw 'Runtime build tool installation failed' }
          python source/runtimes/sh/check-install-layout.py `
            --build-dir "$env:RUNNER_TEMP/SH install layout with spaces" `
            --logs-dir dist/install-layout-windows
          if ($LASTEXITCODE -ne 0) { throw 'Bare-metal runtime install layout failed' }
      - name: Upload install layout receipt (explicit opt-in)
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: llvm-sh-rc1-windows-install-layout
          path: dist/install-layout-windows/**
          if-no-files-found: error
          retention-days: 14

  windows-zip:
    needs: [validate-candidate, windows-runtime-staging]
    if: ${{ inputs.platform != 'linux' }}
    name: Windows Server 2022 / ZIP (x64)
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - name: Keep checkout line endings intact
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out CI scripts only (workflow branch)
        uses: actions/checkout@v6
        with:
          path: automation
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Check out pinned RC1 candidate source (not published tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: source
          persist-credentials: false
      - name: Set up runtime-build Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build, ZIP and smoke test
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check psutil meson==1.12.1 ninja==1.13.0
          if ($LASTEXITCODE -ne 0) { throw 'lit timeout dependency installation failed' }
          ./automation/.github/ci/build-llvm-sh-windows.ps1
      - name: Preserve installed native tools for runtime debugging after failure
        if: ${{ failure() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: llvm-sh-rc1-native-windows-tools-for-debugging
          path: ${{ runner.temp }}/llvm-sh-rc1/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload package and qualification receipts for review (explicit opt-in)
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: llvm-sh-rc1-candidate-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
