--target=shle-unknown-none-elf
-mcpu=sh4
-m4-nofpu
-msoft-float
-mfloat-abi=soft
-ffreestanding
-fno-pic
-fno-pie
-fno-stack-protector
-fno-unwind-tables
-fno-asynchronous-unwind-tables
-fno-exceptions
-fno-rtti
-nostdlib
-nostdlibinc
-nostdinc++
@sh4-resource.cfg
-fuse-ld=lld
--sysroot=<CFGDIR>/../..
-idirafter <CFGDIR>/../../include
-include <CFGDIR>/../../include/sh4-library-profile.h
-static
-L<CFGDIR>/../../lib
