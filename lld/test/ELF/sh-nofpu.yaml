# RUN: not ld.lld %t.fpu.o %t.le.o -o /dev/null 2>&1 | FileCheck %s --check-prefix=MIX
# RUN: yaml2obj -D FLAGS=EF_SH4_NOFPU,EF_SH_FDPIC %s -o %t.fdpic.o
