# NOFPU: Machine: EM_SH
# NOFPU: Flags [ (0x10)
# MIX: SH4 and SH4_NOFPU machine profiles cannot be mixed
# BAD: unsupported SH e_flags:

--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: '[[ENC=ELFDATA2LSB]]'
  Type: ET_REL
  Machine: EM_SH
  Flags: [ [[FLAGS=EF_SH4_NOFPU]] ]
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    Content: '[[CODE=0900]]'
Symbols:
  - Name: '[[ENTRY=_start]]'
    Binding: STB_GLOBAL
    Section: .text
