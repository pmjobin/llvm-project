# RUN: yaml2obj -D ENC=ELFDATA2MSB -D TEXT=FFFFFFFBFFFFFFFCB5FF89FDD3029404FFFF1122 %s -o %t.be.o
# RUN: ld.lld --image-base=0 -Ttext=0x1000 --defsym=external=0x1100 %t.le.o -o %t.le
# RUN: ld.lld --image-base=0 -Ttext=0x1000 --defsym=external=0x1100 %t.be.o -o %t.be
