# GOOD: Machine: EM_SH
# GOOD: Flags [ (0x9)
# FLAGS: unsupported SH e_flags:
# FLAGS-SAME: expected SH4 (0x9)
# CLASS: SH requires ELF32
# BAD-OSABI: unsupported SH OSABI or ABI version
# ENDIAN: incompatible with shlelf
# MODE: SH supports only static non-PIE executables and relocatable links
# DSO: SH shared object inputs are not supported
# TLS: SH TLS is not supported

--- !ELF
FileHeader:
  Class: '[[CLASS=ELFCLASS32]]'
  Data: '[[ENC=ELFDATA2LSB]]'
  Type: '[[TYPE=ET_REL]]'
  Machine: EM_SH
  OSABI: '[[OSABI=ELFOSABI_NONE]]'
  Flags: [ [[FLAGS=EF_SH4]] ]
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, [[SECFLAG=SHF_EXECINSTR]] ]
    AddressAlign: 2
    Content: '0900'
Symbols:
  - Name: '[[ENTRY=_start]]'
    Binding: STB_GLOBAL
    Section: .text
--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2LSB
  Type: ET_DYN
  Machine: EM_SH
  Flags: [ EF_SH4 ]
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    Content: '0900'
DynamicSymbols:
  - Name: _start
    Binding: STB_GLOBAL
    Section: .text
