## The section symbol for the second .rodata moves by 16 in a partial link.
## Adjust the partial-in-place addends in the contents, keeping r_addend=0.
## The non-ALLOC debug section must use the same addend rules as .data.
# PARTIAL: 0x0 R_SH_DIR32 .rodata 0x0
# PARTIAL: 0x4 R_SH_REL32 .rodata 0x0
# PARTIAL: 0x0 R_SH_DIR32 .rodata 0x0
# PARTIAL: 0x00000000 0c000000 14000000
# PARTIAL: 0x00000000 12000000
# FINAL: 0x00003000 0c200000 10f0ffff
# FINAL: 0x00000000 12200000

--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2LSB
  Type: ET_REL
  Machine: EM_SH
  Flags: [ EF_SH4 ]
Sections:
  - Name: .rodata
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC ]
    AddressAlign: 4
    Content: '00000000000000000000000000000000'

--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2LSB
  Type: ET_REL
  Machine: EM_SH
  Flags: [ EF_SH4 ]
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    Content: '0900'
  - Name: .rodata
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC ]
    AddressAlign: 4
    Content: '1122334455667788'
  - Name: .data
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_WRITE ]
    AddressAlign: 4
    Content: 'FCFFFFFF04000000'
  - Name: .rela.data
    Type: SHT_RELA
    Link: .symtab
    Info: .data
    Relocations:
      - Offset: 0
        Type: R_SH_DIR32
        Symbol: .rodata
      - Offset: 4
        Type: R_SH_REL32
        Symbol: .rodata
  - Name: .debug_info
    Type: SHT_PROGBITS
    Content: '02000000'
  - Name: .rela.debug_info
    Type: SHT_RELA
    Link: .symtab
    Info: .debug_info
    Relocations:
      - Offset: 0
        Type: R_SH_DIR32
        Symbol: .rodata
Symbols:
  - Name: .rodata
    Type: STT_SECTION
    Section: .rodata
  - Name: _start
    Binding: STB_GLOBAL
    Section: .text
