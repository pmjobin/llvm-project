# REL-FORMAT: SH requires SHT_RELA relocations

--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2LSB
  Type: ET_REL
  Machine: EM_SH
  Flags: [ EF_SH4 ]
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 4
    Content: '[[TEXT=00B0]]'
  - Name: .rela.text
    Type: '[[RELTYPE=SHT_RELA]]'
    Link: .symtab
    Info: .text
    Relocations:
      - Offset: 0
        Type: '[[TYPE=R_SH_IND12W]]'
        Symbol: target
        Addend: '[[ADDEND=-4]]'
Symbols:
  - Name: _start
    Binding: STB_GLOBAL
    Section: .text
  - Name: target
    Binding: STB_GLOBAL
